# zen-xe: patched Intel xe display driver for Panther Lake laptops (ASUS Zenbook Duo UX8407AA).
# build.sh fetches drivers/gpu/drm/{xe,i915} of the exact kernel being built for, applies the
# patch series for that kernel line (series/X.Y) and builds xe.ko out of tree. If anything
# fails, DKMS reports it and the stock xe stays in use.
PACKAGE_NAME="zen-xe"
PACKAGE_VERSION="@VERSION@"
BUILD_EXCLUSIVE_KERNEL="^7\."
MAKE[0]="bash ./build.sh ${kernelver} ${kernel_source_dir}"
CLEAN="rm -rf src ktree"
BUILT_MODULE_NAME[0]="xe"
BUILT_MODULE_LOCATION[0]="src/drivers/gpu/drm/xe/"
# depmod searches updates/ before kernel/ on every mainstream distribution, so this wins.
DEST_MODULE_LOCATION[0]="/updates/dkms"
STRIP[0]="yes"
AUTOINSTALL="yes"
